<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: transparent; overflow: hidden; width: 100%; display: flex; justify-content: center; }
        #root { width: 100%; display: flex; justify-content: center; }
        .pitch-player-card {
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .pitch-player-card-abs:hover {
            transform: translate(-50%, -50%) scale(1.08) !important;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.65) !important;
            border-color: #38bdf8 !important;
        }
        .pitch-player-card-flex:hover {
            transform: scale(1.06) !important;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.65) !important;
            border-color: #38bdf8 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        function sendValue(playerName) {
            if (!playerName) return;
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: { player: playerName, ts: Date.now() }
            }, "*");
        }

        document.getElementById("root").addEventListener("click", function(e) {
            const card = e.target.closest(".pitch-player-card");
            if (!card) return;
            const player = card.getAttribute("data-player");
            if (player) {
                sendValue(player);
            }
        });

        function onRender(event) {
            const data = event.data;
            if (!data || data.type !== "streamlit:render") return;
            const args = data.args;
            if (args && args.html) {
                document.getElementById("root").innerHTML = args.html;
            }
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setFrameHeight",
                height: 645
            }, "*");
        }

        window.addEventListener("message", onRender);
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1
        }, "*");
    </script>
</body>
</html>
